<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AIニュース">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>AIニュース</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--ink:#f1f5f9;--sub:#94a3b8;--accent:#38bdf8;--use:#164e63;--ok:#22c55e;--warn:#f59e0b;--ng:#64748b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Hiragino Sans","BIZ UDPGothic",sans-serif;line-height:1.6;padding:0 16px calc(24px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;background:var(--bg);padding:calc(12px + env(safe-area-inset-top)) 0 10px;display:flex;justify-content:space-between;align-items:center;z-index:2}
h1{font-size:18px;margin:0}
.date{color:var(--sub);font-size:13px}
video{width:100%;border-radius:12px;background:#000;aspect-ratio:16/9;display:block}
h2{font-size:16px;margin:24px 0 10px;color:var(--accent)}
.topic{background:var(--card);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.topic b{display:block;font-size:15px}
.topic .use{margin-top:6px;font-size:14px;color:#cbd5e1}
.src{font-size:12px;color:var(--sub);margin-top:4px}
.src a{color:var(--sub)}
.listen{width:100%;margin-top:10px;background:var(--card);border:1px solid #334155}
audio{width:100%;margin-top:10px}
.kind{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:99px;margin-bottom:4px;color:#0f172a}
.topic{position:relative}
.vote{float:right;display:flex;gap:4px;margin:0 0 4px 8px}
.vote button{flex:0 0 auto;padding:4px 8px;font-size:16px;background:#0b1222;opacity:.55}
.vote button.on{opacity:1;background:#334155;outline:2px solid var(--accent)}
.hint{font-size:11px;color:var(--sub);font-weight:400}
.basis{font-size:12px;color:#fde68a;background:#1f2937;border-radius:8px;padding:6px 8px;margin-top:6px}
.banner{background:#1e293b;border-left:4px solid var(--warn);border-radius:8px;padding:10px 12px;margin:0 0 12px;font-size:14px}
.banner.bad{border-left-color:#ef4444}
.runs{margin-top:24px;color:var(--sub);font-size:13px}
.runs summary{cursor:pointer;padding:8px 0}
.run{padding:6px 0;border-top:1px solid #1e293b}
.tabs{display:flex;gap:6px;margin:0 0 14px}
.tabs button{flex:1;padding:9px 4px;font-size:13px;background:var(--card);white-space:nowrap}
.tabs button.on{background:var(--accent);color:#0f172a;font-weight:700}
.disclaimer{font-size:12px;color:var(--sub);text-align:center;margin:14px 0}
.k-rates{background:#f87171}.k-stocks{background:#a78bfa}.k-fx{background:#2dd4bf}.k-market{background:#fbbf24}.k-nisa{background:#f472b6}.k-phone{background:#60a5fa}.k-app{background:#38bdf8}.k-life{background:#4ade80}
.k-ai{background:#38bdf8}.k-realestate{background:#fbbf24}.k-tools{background:#4ade80}
.prop{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;border:1px solid #334155}
.prop h3{margin:0 0 6px;font-size:16px}
.prop p{margin:6px 0;font-size:14px}
.prop .how{color:#cbd5e1;font-size:13px}
.meta{font-size:12px;color:var(--sub)}
.btns{display:flex;gap:8px;margin-top:12px}
button{font:inherit;border:0;border-radius:10px;padding:11px 10px;color:var(--ink);background:#334155;flex:1;font-size:14px}
button.go{background:var(--accent);color:#0f172a;font-weight:700;flex:2}
.badge{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;margin-bottom:6px;font-weight:700}
.b-approved,.b-building{background:var(--warn);color:#111}
.b-built{background:var(--ok);color:#052e16}
.b-failed{background:#ef4444}
.b-rejected,.b-later{background:var(--ng)}
.b-deployed{background:var(--accent);color:#0f172a}
.note{white-space:pre-wrap;background:#0b1222;border-radius:8px;padding:8px 10px;font-size:13px;margin-top:8px}
.past{display:flex;gap:10px;align-items:center;background:var(--card);border-radius:12px;padding:8px;margin-bottom:8px;width:100%;text-align:left}
.past img{width:96px;border-radius:6px;aspect-ratio:16/9;object-fit:cover;background:#000}
.empty,.err{color:var(--sub);font-size:14px;padding:20px 0;text-align:center}
.lock{max-width:420px;margin:30vh auto 0;text-align:center}
.lock input{width:100%;padding:12px;border-radius:10px;border:1px solid #334155;background:var(--card);color:var(--ink);font-size:16px;margin:12px 0}
</style>
</head>
<body>
<div id="root"></div>
<script>
const API = "https://aevqdsozxiklyjfavvhf.supabase.co/functions/v1/api";
const LABEL = {approved:"承認済み・作成待ち",building:"作成中…",built:"できました・確認待ち",failed:"作成でつまずきました",rejected:"見送り",later:"あとで",deployed:"反映済み"};
const KIND = { ai: "AI", realestate: "不動産", tools: "使っている道具", rates: "金利", stocks: "株", fx: "為替", market: "不動産市場", nisa: "NISA・制度", phone: "スマホ", app: "AIアプリ", life: "暮らし" };
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function getKey() {
  const m = location.hash.match(/k=([0-9a-f]{64})/);
  if (m) { try { localStorage.setItem("aiNewsKey", m[1]); } catch {} history.replaceState(null, "", location.pathname); return m[1]; }
  try { return localStorage.getItem("aiNewsKey"); } catch { return null; }
}
let KEY = getKey();
let state = { episodes: [], proposals: [], runs: [], votes: [], current: null, series: {}, seriesPick: {}, tab: "daily" };

async function api(action, body = {}) {
  const r = await fetch(API, { method: "POST", headers: { "content-type": "application/json", "x-key": KEY }, body: JSON.stringify({ action, ...body }) });
  if (r.status === 401) { try { localStorage.removeItem("aiNewsKey"); } catch {} KEY = null; renderLock("合言葉が違うようです"); throw new Error("unauthorized"); }
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

function renderLock(msg = "") {
  $("#root").innerHTML = `<div class="lock"><h1>AIニュース</h1><p class="date">最初の1回だけ、合言葉を入れてください</p>
    <input id="k" placeholder="合言葉" autocomplete="off"><button class="go" id="ok">開く</button><p class="err">${esc(msg)}</p></div>`;
  $("#ok").onclick = () => { KEY = $("#k").value.trim(); try { localStorage.setItem("aiNewsKey", KEY); } catch {} load(); };
}

function propCard(p) {
  const actionable = p.status === "proposed" || p.status === "later";
  return `<div class="prop" data-id="${p.id}">
    ${p.status !== "proposed" ? `<span class="badge b-${p.status}">${LABEL[p.status] || p.status}</span>` : ""}
    <h3>${esc(p.title)}</h3>
    <p>${esc(p.what)}</p>
    <p class="how">${esc(p.how)}</p>
    ${p.basis ? `<div class="basis">🔗 ${esc(p.basis)}</div>` : ""}
    <div class="meta">対象：${esc(p.target || "-")}　目安：${esc(p.effort || "-")}</div>
    ${p.result_note ? `<div class="note">${esc(p.result_note)}</div>` : ""}
    ${actionable ? `<div class="btns"><button class="go" data-s="approved">いいね、やって</button><button data-s="later">あとで</button><button data-s="rejected">いらない</button></div>` : ""}
    ${p.status === "approved" ? `<div class="btns"><button data-s="proposed">取り消す</button></div>` : ""}
    ${p.status === "failed" ? `<div class="btns"><button class="go" data-s="approved">作り直す</button><button data-s="rejected">やめておく</button></div>` : ""}
  </div>`;
}

const ymd = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const hm = (iso) => { const d = new Date(iso); return `${d.getMonth() + 1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2, "0")}`; };

// 今日の分が届いていない時の知らせ(朝7時以降)
function missingBanner() {
  const now = new Date(), today = ymd(now);
  if (now.getHours() < 7 || state.episodes.some((e) => e.date === today)) return "";
  const failToday = state.runs.find((r) => r.kind === "daily" && r.status === "fail" && ymd(new Date(r.created_at)) === today);
  return failToday
    ? `<div class="banner bad">⚠ 今日の分は作れませんでした（${esc(hm(failToday.created_at))}）<br><small>${esc(failToday.note || "")}</small><br><small>Claudeに「AIニュースが失敗した」と言えば直します</small></div>`
    : `<div class="banner">今日の分はまだ届いていません。会社のPCが起動していない可能性があります（起動すると数分で作られます）</div>`;
}

function runsLog() {
  if (!state.runs.length) return "";
  const KL = { daily: "毎朝の動画", build: "提案の作成", money: "お金・NISA", life: "暮らしのAI" }, SL = { ok: "✅", fail: "❌", skip: "–" };
  return `<details class="runs"><summary>動作記録（直近${Math.min(state.runs.length, 14)}件）</summary>${state.runs.slice(0, 14).map((r) =>
    `<div class="run">${SL[r.status] || r.status} ${esc(hm(r.created_at))} ${KL[r.kind] || r.kind}${r.seconds ? `・${Math.round(r.seconds / 60)}分` : ""}<br><small>${esc(r.note || "")}</small></div>`).join("")}</details>`;
}

function voteOf(date, no) { return state.votes.find((v) => v.episode_date === date && v.topic_no === no)?.vote || 0; }

// タブ: 仕事(不動産×AI) / お金・NISA / 暮らしのAI。どれも毎朝届く
function tabs() {
  const T = [["daily", "仕事"], ["money", "お金・NISA"], ["life", "暮らしのAI"]];
  return `<nav class="tabs">${T.map(([k, l]) => `<button data-tab="${k}" class="${state.tab === k ? "on" : ""}">${l}</button>`).join("")}</nav>`;
}
const srcLink = (t) => t.source ? `<div class="src">出典：${t.url && /^https?:\/\//.test(t.url) ? `<a href="${esc(t.url)}" target="_blank" rel="noopener">${esc(t.source)}</a>` : esc(t.source)}</div>` : "";
const player = (ep) => `${ep.video_url ? `<video controls playsinline preload="metadata" poster="${esc(ep.thumb_url || "")}" src="${esc(ep.video_url)}"></video>` : `<p class="empty">この回の動画は保存期間(30日)を過ぎました</p>`}
    ${ep.audio_url ? `<button id="listen" class="listen">🎧 音声だけで聴く（画面を消しても流れます）</button><audio id="aud" controls preload="none" src="${esc(ep.audio_url)}" hidden></audio>` : ""}`;

function bindCommon(ep, artist) {
  document.querySelectorAll(".tabs button").forEach((b) => b.onclick = () => {
    state.tab = b.dataset.tab;
    render(); scrollTo(0, 0);
  });
  if ($("#reload")) $("#reload").onclick = load;
  if ($("#listen")) $("#listen").onclick = () => {
    const a = $("#aud"), v = $("video");
    if (v) v.pause();
    a.hidden = false; $("#listen").hidden = true; a.play().catch(() => {});
    if ("mediaSession" in navigator) navigator.mediaSession.metadata = new MediaMetadata({ title: ep.title, artist });
  };
}

// 仕事タブ以外の見せ方。タブを増やす時はここと tabs() に足す
const SERIES = {
  money: { label: "お金・NISA", heading: "今日の動き", use: "下田さん目線", empty: "毎朝、株・金利・為替・NISAの動きを、NISAの長期目線と不動産の仕事目線で届けます。",
    note: "情報の整理です。特定の投資をすすめるものではありません。" },
  life: { label: "暮らしのAI", heading: "今日の3つ", use: "やってみる手順", empty: "毎朝、仕事以外の毎日がちょっと楽になるAIの使い方を3つ届けます。", note: "" },
};

function renderSeries(name) {
  const cfg = SERIES[name], list = state.series[name] || [];
  const ep = list.find((e) => e.date === state.seriesPick[name]) || list[0];
  if (!ep) {
    $("#root").innerHTML = `<header><h1>${cfg.label}</h1><button id="reload" style="flex:0 0 auto">更新</button></header>${tabs()}<p class="empty">${cfg.empty}</p>`;
    return bindCommon({}, "");
  }
  const past = list.filter((e) => e.date !== ep.date);
  const mine = state.proposals.filter((p) => p.series === name);
  const props = mine.filter((p) => p.episode_date === ep.date);
  const inflight = mine.filter((p) => p.episode_date !== ep.date && INFLIGHT.includes(p.status));
  const d = new Date(ep.date + "T00:00:00");
  $("#root").innerHTML = `
    <header><div><h1>${esc(ep.title)}</h1><div class="date">${d.getMonth() + 1}月${d.getDate()}日・約${Math.round((ep.duration_sec || 0) / 60)}分</div></div>
      <button id="reload" style="flex:0 0 auto">更新</button></header>
    ${tabs()}
    ${player(ep)}
    ${props.length ? `<h2>私が作れる提案</h2>${props.map(propCard).join("")}` : ""}
    ${inflight.length ? `<h2>進行中・保留の提案</h2>${inflight.map(propCard).join("")}` : ""}
    <h2>${cfg.heading}</h2>
    ${(ep.topics || []).map((t) => `<div class="topic">${KIND[t.kind] ? `<span class="kind k-${t.kind}">${KIND[t.kind]}</span>` : ""}<b>${esc(t.title)}</b>${t.use ? `<div class="use">→ ${cfg.use}：${esc(t.use)}</div>` : ""}${srcLink(t)}</div>`).join("")}
    ${cfg.note ? `<p class="disclaimer">${cfg.note}</p>` : ""}
    ${past.length ? `<h2>過去の回</h2>${past.map((e) => `<button class="past" data-date="${e.date}">${e.thumb_url ? `<img src="${esc(e.thumb_url)}" alt="">` : ""}<span>${esc(e.title)}</span></button>`).join("")}` : ""}`;
  bindCommon(ep, `下田さん専用 ${cfg.label}`);
  document.querySelectorAll(".past").forEach((b) => b.onclick = () => { state.seriesPick[name] = b.dataset.date; render(); scrollTo(0, 0); });
  bindProps();
}

function render() {
  if (SERIES[state.tab]) return renderSeries(state.tab);
  const ep = state.current;
  if (!ep) { $("#root").innerHTML = `<header><h1>AIニュース</h1><button id="reload" style="flex:0 0 auto">更新</button></header>${tabs()}${missingBanner()}<p class="empty">まだ動画がありません。明日の朝をお楽しみに。</p>${runsLog()}`; return bindCommon({}, ""); }
  const mine = state.proposals.filter((p) => (p.series || "daily") === "daily");
  const props = mine.filter((p) => p.episode_date === ep.date);
  const combos = state.proposals.filter((p) => p.series === "combo");
  const latestCombo = combos.map((p) => p.episode_date).sort().pop();
  const comboNew = combos.filter((p) => p.episode_date === latestCombo && p.status === "proposed");
  const inflight = [...mine.filter((p) => p.episode_date !== ep.date), ...combos].filter((p) => INFLIGHT.includes(p.status));
  const past = state.episodes.filter((e) => e.date !== ep.date);
  const d = new Date(ep.date + "T00:00:00");
  $("#root").innerHTML = `
    <header><div><h1>${esc(ep.title)}</h1><div class="date">${d.getMonth() + 1}月${d.getDate()}日・約${Math.round((ep.duration_sec || 0) / 60)}分</div></div>
      <button id="reload" style="flex:0 0 auto">更新</button></header>
    ${tabs()}
    ${missingBanner()}
    ${player(ep)}
    <h2>今日の提案</h2>
    ${props.length ? props.map(propCard).join("") : `<p class="empty">提案はありません</p>`}
    ${comboNew.length ? `<h2>🔗 掛け合わせ提案 <small class="hint">週1回・貯まった材料から</small></h2>${comboNew.map(propCard).join("")}` : ""}
    ${inflight.length ? `<h2>進行中・保留の提案</h2>${inflight.map(propCard).join("")}` : ""}
    <h2>ニュースの中身 <small class="hint">👍👎で好みを覚えます</small></h2>
    ${(ep.topics || []).map((t, i) => `<div class="topic"><div class="vote" data-no="${i + 1}"><button data-v="1" class="${voteOf(ep.date, i + 1) === 1 ? "on" : ""}">👍</button><button data-v="-1" class="${voteOf(ep.date, i + 1) === -1 ? "on" : ""}">👎</button></div>${KIND[t.kind] ? `<span class="kind k-${t.kind}">${KIND[t.kind]}</span>` : ""}<b>${esc(t.title)}</b>${t.use ? `<div class="use">→ ${esc(t.use)}</div>` : ""}${srcLink(t)}</div>`).join("")}
    ${past.length ? `<h2>過去の回</h2>${past.map((e) => `<button class="past" data-date="${e.date}">${e.thumb_url ? `<img src="${esc(e.thumb_url)}" alt="">` : ""}<span>${esc(e.title)}</span></button>`).join("")}` : ""}
    ${runsLog()}`;
  document.querySelectorAll(".vote button").forEach((b) => b.onclick = async () => {
    const no = +b.parentElement.dataset.no, v = +b.dataset.v;
    const next = voteOf(ep.date, no) === v ? 0 : v;  // 同じボタンをもう一度押すと取り消し
    b.disabled = true;
    try {
      await api("vote", { episode_date: ep.date, topic_no: no, vote: next });
      state.votes = state.votes.filter((x) => !(x.episode_date === ep.date && x.topic_no === no));
      state.votes.push({ episode_date: ep.date, topic_no: no, vote: next });
      render();
    } catch { b.disabled = false; }
  });
  bindCommon(ep, "下田さん専用 AIニュース");
  document.querySelectorAll(".past").forEach((b) => b.onclick = () => { state.current = state.episodes.find((e) => e.date === b.dataset.date); render(); scrollTo(0, 0); });
  bindProps();
}

function bindProps() {
  document.querySelectorAll(".prop button[data-s]").forEach((b) => b.onclick = async () => {
    const id = b.closest(".prop").dataset.id, s = b.dataset.s;
    b.disabled = true;
    try { await api("set_status", { id, status: s }); const p = state.proposals.find((x) => x.id === id); p.status = s; render(); }
    catch (e) { b.disabled = false; alert("送れませんでした。電波を確認してもう一度押してください"); }
  });
}
const INFLIGHT = ["approved", "building", "built", "failed", "later"];

async function load() {
  if (!KEY) return renderLock();
  try {
    const r = await api("list");
    const keep = state.current?.date;
    state.episodes = r.episodes; state.proposals = r.proposals; state.runs = r.runs || []; state.votes = r.votes || [];
    state.current = r.episodes.find((e) => e.date === keep) || r.episodes[0] || null;
    state.series = r.series || {};
    render();
  } catch (e) { if (e.message !== "unauthorized") $("#root").innerHTML = `<p class="err">読み込めませんでした。電波を確認して開き直してください。</p>`; }
}
load();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
