<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#14213d">
<meta name="apple-mobile-web-app-title" content="もも">
<link rel="manifest" href="hayato-manifest.json?v=momo1">
<link rel="apple-touch-icon" href="hisho-icon-180.png" sizes="180x180">
<link rel="icon" href="hisho-icon-192.png" type="image/png">
<title>もも</title>
<style>
:root{--bg:#14213d;--cyan:#d8ae55;--cyan2:#f1d58e;--text:#f4f2ee;--muted:#c9cfdb;--line:rgba(216,174,85,.5)}
html,body{margin:0;height:100%;background:radial-gradient(ellipse at 50% 35%,#22345c,#14213d 65%);color:var(--text);font-family:"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif}
.box{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;box-sizing:border-box;text-align:center;gap:14px}
.logo{font-weight:800;letter-spacing:.4em;font-size:26px;color:var(--cyan2);text-shadow:0 0 14px var(--cyan);padding-left:.4em}
.ring{width:90px;height:90px;border-radius:50%;border:2px solid var(--cyan);box-shadow:0 0 30px rgba(95,214,255,.5),inset 0 0 20px rgba(95,214,255,.3);animation:spin 3s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
p{margin:0;font-size:14px;color:var(--muted);line-height:1.7}
input{width:100%;max-width:320px;box-sizing:border-box;background:#0e1830;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:12px;font-size:16px}
button{min-height:46px;padding:0 22px;border-radius:8px;border:1px solid var(--line);background:rgba(95,214,255,.15);color:var(--cyan2);font-weight:800;font-size:15px}
#keyBox{display:none;flex-direction:column;align-items:center;gap:10px;width:100%}
[hidden]{display:none!important}
.install-icon{width:108px;height:108px;border-radius:24px;box-shadow:0 0 30px rgba(216,174,85,.35)}
.install-mode{background:radial-gradient(ellipse at 50% 35%,#22345c,#14213d 68%)}
.install-mode .ring{display:none}
.install-mode #openApp{background:#d8ae55;color:#14213d}
</style>
</head>
<body>
<div class="box">
  <div class="ring"></div>
  <img class="install-icon" id="installIcon" src="hisho-icon-192.png" alt="" width="108" height="108" hidden>
  <div class="logo">もも</div>
  <p id="msg">ももを呼んでいます…</p>
  <button id="openApp" type="button" hidden>ももを開く</button>
  <div id="keyBox">
    <p>最初の1回だけ、合言葉を入れてください。<br>（PCの hayato\.secrets\key.txt）</p>
    <input id="k" placeholder="合言葉" autocomplete="off">
    <button id="ok">ももを開く</button>
  </div>
</div>
<script>
// ハヤトの入口：PCが毎回変わるURLを ntfy に置く → ここで最新を読んで、合言葉をつけて開く。
// 合言葉はこのスマホの中（この入口ページ）にだけ覚える。ntfy には載せない。
const TOPIC = "hayato-url-3218359548";
const $ = s => document.querySelector(s);
const MORNING = /morning/.test(location.hash);
const NUDGE = /nudge/.test(location.hash);  // 「ハヤトから一言」の通知から来た時は、その一言を開く  // 朝の報告の通知から来た時は、ハヤトで報告カードを開く
const normKey = k => String(k || "").normalize("NFKC").replace(/\s+/g, "");  // 全角で入れても半角に
const get = k => { try { return localStorage.getItem(k) || ""; } catch { return ""; } };
const set = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
// 筋トレ(ATLAS)・計量(KEIRYO)・賃管特訓は、この入口と同じ場所(toshi5128.github.io)にあるので記録が読める。
// 開くたびに、変わっていればハヤト（PC）へ渡す → ハヤトが体・食事・勉強にも意見を言える。PCの中にだけ置く
const LIFE_KEYS = ["gym_logs_v2", "gym_exercises_v2", "gym_bw_v1", "gym_meas_v1", "gym_dayinfo_v1", "gym_meals_v1", "gym_drinks_v1",
  "gym_supps_v1", "gym_program_v1", "gym_settings_v1", "keiryo.v1", "chinkan.v1"];
async function sendLife(url, key) {
  const body = {};
  for (const k of LIFE_KEYS) { const v = get(k); if (v) body[k] = v; }
  const names = Object.keys(body);
  // 届かない時の手がかり：どのアプリの記録が見えたかだけ PC に知らせる（中身は送らない）
  try { fetch(url + "/api/clientlog", { method: "POST", body: `入口 見えた記録 ${names.join(",") || "なし"} ${navigator.userAgent.slice(0, 60)}` }); } catch {}
  if (!names.length) return;
  const json = JSON.stringify(body);
  const sig = json.length + ":" + json.slice(-200);
  if (get("hayato_life_sig") === sig) return;  // 前回から変わっていなければ送らない
  $("#msg").textContent = "記録を渡しています…";
  const ac = new AbortController(); const t = setTimeout(() => ac.abort(), 25000);
  try {
    const r = await fetch(url + "/api/life", { method: "POST", headers: { "X-Key": key, "Content-Type": "application/json" }, body: json, signal: ac.signal });
    if (r.ok) set("hayato_life_sig", sig);
  } catch {} finally { clearTimeout(t); }
}
async function go() {
  const key = normKey(get("hayato_key"));
  if (!key) { $("#msg").textContent = "合言葉がまだありません"; $("#keyBox").style.display = "flex"; return; }
  // 英数字・記号以外（日本語など）が混じった合言葉は送れない（2026-11-16 ももの画面で案件と絵が出なかった）→ 入れ直してもらう
  if (/[^!-~]/.test(key)) { set("hayato_key", ""); $("#msg").textContent = "合言葉を英数字で入れ直してください（日本語が混じっていました）"; $("#keyBox").style.display = "flex"; return; }
  try {
    const t = await (await fetch(`https://ntfy.sh/${TOPIC}/json?poll=1&since=24h`)).text();
    const urls = t.trim().split("\n").map(l => { try { return JSON.parse(l).message; } catch { return ""; } })
      .filter(u => /^https:\/\/[a-z0-9-]+\.trycloudflare\.com$/.test(u || ""));
    const url = urls[urls.length - 1];
    if (!url) { $("#msg").innerHTML = "ももが見つかりません。<br>PCの電源が入っていて、ももが起動しているか確認してください。"; return; }
    await sendLife(url, key);
    $("#msg").textContent = "つながりました";
    const dest = url + "/#k=" + encodeURIComponent(key) + (MORNING ? "&morning=1" : "") + (NUDGE ? "&nudge=1" : "") + (/req/.test(location.hash) ? "&req=1" : "") + (/inbox|check/.test(location.hash) ? "&inbox=1" : "") + (/news/.test(location.hash) ? "&news=1" : "");
    // ホーム画面のアプリから開いた時は、この入口の中にももを全画面で埋め込む（別のURLへ飛ぶと、上にURLの帯が出て「サイト」に見えていた 2026-11-16）
    if (!/[?&]noembed=1/.test(location.search)) {  // いつでも埋め込む（アプリ判定がずれても帯を出さない）。?noembed=1 で前の飛び方
      const f = document.createElement("iframe");
      f.src = dest;
      f.allow = "microphone; autoplay; clipboard-write; fullscreen";
      f.style.cssText = "position:fixed;inset:0;width:100%;height:100%;border:0;background:#111;z-index:99";
      document.body.append(f);
      document.body.style.overflow = "hidden";
      return;
    }
    location.replace(dest);
  } catch (e) { $("#msg").textContent = "つながりませんでした（" + e.message + "）"; }
}
$("#ok").onclick = () => { const v = normKey($("#k").value); if (!v) return; if (/[^!-~]/.test(v)) { $("#msg").textContent = "合言葉は英数字で入れてください"; return; } set("hayato_key", v); $("#keyBox").style.display = "none"; $("#msg").textContent = "ももを呼んでいます…"; go(); };
const installRequested = new URLSearchParams(location.search).get("install") === "1";
const installed = navigator.standalone || matchMedia("(display-mode: standalone)").matches;
const hk = location.hash.match(/k=([^&]+)/);
if (hk) { set("hayato_key", normKey(decodeURIComponent(hk[1]))); history.replaceState(null, "", location.pathname + location.search); }
if (installRequested && !installed) {
  document.body.classList.add("install-mode");
  $("#installIcon").hidden = false;
  $("#msg").textContent = "ブラウザーのメニューから「ホーム画面に追加」を選んでください。";
  $("#openApp").hidden = false;
  $("#openApp").onclick = () => {
    $("#openApp").hidden = true;
    $("#msg").textContent = "ももを呼んでいます…";
    go();
  };
} else {
  go();
}
</script>
</body>
</html>
