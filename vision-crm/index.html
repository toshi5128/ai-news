}

html{background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--txt);font-family:"Zen Kaku Gothic New",system-ui,sans-serif;font-size:15px;line-height:1.6;

svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}

.brand .w{font-family:Marcellus,serif;letter-spacing:.32em;color:var(--gold2);font-size:12px}

.hd .sp{flex:1}

main{max-width:720px;margin:0 auto;padding:8px 16px calc(110px + env(safe-area-inset-bottom))}

.todo .go{color:var(--faint);align-self:center}

.filters{display:flex;gap:6px;overflow-x:auto;margin:0 -16px;padding:2px 16px 4px;scrollbar-width:none}

.filters button i{font-style:normal;font-family:"Space Grotesk";opacity:.7;margin-left:3px}
.search{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.07);border:1px solid rgba(214,189,127,.3);border-radius:14px;padding:0 12px;margin:12px 0;color:var(--onsub)}

.cust{cursor:pointer}

.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.meta span{font-size:12px;background:var(--surface2);border-radius:8px;padding:2px 9px;color:var(--sub)}
.meta span.bad{background:#ecd0c6;color:var(--neg);font-weight:700}
.meta span.good{background:#d4e2cf;color:var(--pos)}
/* カルテ */
.back{display:inline-flex;align-items:center;gap:4px;background:none;border:0;color:var(--gold2);font-weight:700;padding:6px 0 10px}
.kh{color:var(--on);padding:4px 4px 6px}
.kh .sub{font-size:12px;color:var(--gold2);letter-spacing:.06em}

.acts a,.acts button{display:flex;flex-direction:column;align-items:center;gap:5px;background:rgba(255,255,255,.06);border:1px solid rgba(214,189,127,.28);color:var(--on);border-radius:16px;padding:11px 0 9px;font-size:11px;text-decoration:none;font-weight:700}
.acts svg.i{color:var(--gold2)}
.acts .off{opacity:.3;pointer-events:none}
.kv{display:grid;grid-template-columns:auto 1fr;gap:9px 16px;font-size:14px;margin:0}
.kv dt{color:var(--sub);font-size:13px}.kv dd{margin:0;font-weight:500}
.alert{display:flex;gap:10px;align-items:flex-start;border-radius:14px;padding:11px 13px;font-size:13px;margin-bottom:8px;font-weight:500;line-height:1.55}

.months{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.mo{border-radius:12px;padding:7px 2px;text-align:center;font-size:11px;cursor:pointer;background:var(--surface2);color:var(--faint);border:1.5px solid transparent}
.mo b{display:block;font-size:14px;font-family:"Space Grotesk"}

.counter{display:flex;align-items:baseline;gap:4px}
.counter b{font-size:40px;font-family:"Space Grotesk";color:var(--txt);line-height:1}
.counter.over b{color:var(--neg)}
.dots{display:flex;gap:6px;margin-left:12px}

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const yen = n => (n < 0 ? "-" : "") + "¥" + Math.abs(Math.round(n)).toLocaleString();

const store = { get(k) { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
const pad = n => String(n).padStart(2, "0");
const D = s => { if (!s) return null; const [y, m, d] = String(s).slice(0, 10).split("-").map(Number); return new Date(y, m - 1, d); };
const iso = d => d ? `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}` : "";
const ymOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
const today = () => { const t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); };
const addM = (d, n) => { const r = new Date(d.getFullYear(), d.getMonth() + n, 1); const last = new Date(r.getFullYear(), r.getMonth() + 1, 0).getDate(); r.setDate(Math.min(d.getDate(), last)); return r; };
const addD = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const diffD = (a, b) => Math.round((a - b) / 86400000);
const ymAdd = (ym, n) => { const [y, m] = ym.split("-").map(Number); return ymOf(new Date(y, m - 1 + n, 1)); };
const ymLabel = ym => { const [y, m] = ym.split("-").map(Number); return `${y}年${m}月`; };
const jd = s => { const d = D(s); return d ? `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}` : "—"; };
const jdk = s => { const d = D(s); return d ? `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日` : ""; };
const jdt = s => { if (!s) return "—"; const d = new Date(s); return `${d.getMonth() + 1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const isBiz = d => d.getDay() !== 0 && d.getDay() !== 6 && !HOLI.has(iso(d));
const bizAdd = (d, n) => { let r = new Date(d.getFullYear(), d.getMonth(), d.getDate()); while (n > 0) { r = addD(r, 1); if (isBiz(r)) n--; } return r; };
const monthsBetween = (a, b) => { const [y1, m1] = a.split("-").map(Number), [y2, m2] = b.split("-").map(Number); return (y2 - y1) * 12 + (m2 - m1); };
const taxIn = n => Math.floor(n * 10 / 110);

const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now() + "-" + Math.random().toString(36).slice(2));
async function save(kind, row) {

  if (row.id && list.some(x => x.id === row.id)) {

    const i = list.findIndex(x => x.id === id); list[i] = { ...list[i], ...row };
    return list[i];
  }

/* ───── 契約の計算（契約書の条文どおり） ───── */
function contract(c) {
  const T = today(), p = D(c.publish_date);
  if (!p) return { started: false };
  const end = addD(addM(p, MIN_YEARS * 12), -1);                    // 公開日から5年（4条1項）
  const noticeBy = addM(end, -3);                                   // 満了3か月前（4条2項）
  const after = T > end;
  const leftM = Math.max(0, monthsBetween(ymOf(T), ymOf(end)));
  return { started: true, p, end, noticeBy, after, leftM, endYM: ymOf(end) };
}
function cancelPlan(c, noticeStr) {                                 // 申出日 → 解約日・解約金（7条）
  const k = contract(c), n = D(noticeStr) || today();
  const cdate = addM(n, 1);
  if (!k.started) return { cdate, fee: 0, months: 0, note: "公開前のため解約金の計算対象外（扱いは要相談）" };
  if (cdate > k.end) return { cdate, fee: 0, months: 0, note: "満了後のため解約金なし（4条3項）" };
  const months = Math.max(0, monthsBetween(ymOf(cdate), k.endYM));
  return { cdate, fee: months * (c.monthly || PRICE), months, note: `解約月の翌月〜満了月（${ymLabel(k.endYM)}）の${months}か月分（7条2項）` };
}
function dueMonths(c) {
  const k = contract(c); if (!k.started) return [];
  const T = today(), out = [], startYM = ymOf(k.p);
  let lastYM = ymOf(T);
  if (c.cancel_date) { const cd = D(c.cancel_date); if (ymOf(cd) < lastYM) lastYM = ymOf(cd); }
  for (let ym = startYM; ym <= lastYM; ym = ymAdd(ym, 1)) {
    const [y, m] = ym.split("-").map(Number);
    const due = ym === startYM ? k.p : new Date(y, m - 1, Math.min(c.pay_day || 27, new Date(y, m, 0).getDate()));
    out.push({ ym, due, passed: due <= T });
  }
  return out;
}
function payOf(cid, ym) { return DB.payments.find(p => p.customer_id === cid && p.month === ym && p.kind === "monthly"); }
function money(c) {
  const T = today(), rows = dueMonths(c).filter(r => r.passed), unpaid = [], pending = [];
  for (const r of rows) {
    const p = payOf(c.id, r.ym);
    if (p && (p.status === "paid" || p.status === "waived")) continue;
    if (p && p.status === "failed") unpaid.push(r);
    else if (diffD(T, r.due) >= 3) unpaid.push(r); else pending.push(r);
  }
  const late = unpaid.reduce((s, r) => s + (c.monthly || PRICE) * 0.146 * Math.max(0, diffD(T, r.due) - 1) / 365, 0);
  return { unpaid, pending, owed: unpaid.length * (c.monthly || PRICE), late };
}
const countable = r => r.counted !== false && (r.kind || "small") === "small" && !["merged", "closed_reject", "closed_stop"].includes(r.status);
function fixCount(cid, ym) { return DB.requests.filter(r => r.customer_id === cid && countable(r) && ymOf(new Date(r.received_at)) === ym).length; }
function reqDue(r) { return bizAdd(new Date(r.received_at), 5); }
const reqOpen = r => !["done", "closed_self", "closed_reject", "closed_stop", "merged"].includes(r.status);
function lastContact(cid) { const e = DB.events.filter(e => e.customer_id === cid && ["call", "visit", "line", "mail"].includes(e.type)).sort((a, b) => b.at.localeCompare(a.at))[0]; const r = DB.requests.filter(r => r.customer_id === cid).sort((a, b) => b.received_at.localeCompare(a.received_at))[0]; const ts = [e && e.at, r && r.received_at].filter(Boolean).sort().pop(); return ts ? new Date(ts) : null; }
function futureContracted() { return DB.customers.filter(c => ["live", "prep", "stopped"].includes(c.status)).reduce((s, c) => { const k = contract(c); return s + (k.started && !k.after ? (k.leftM + (dueMonths(c).slice(-1)[0]?.passed ? 0 : 1)) * (c.monthly || PRICE) : !k.started ? MIN_YEARS * 12 * (c.monthly || PRICE) : 0); }, 0); }

function todos() {
  const T = today(), out = [];
  const add = (lv, ic, title, sub, go) => out.push({ lv, ic, title, sub, go });
  for (const c of DB.customers) {
    if (c.status === "closed") {
      const left = CLOSEOUT.filter(([k]) => !(c.closeout || {})[k]);
      if (left.length) add(1, "list", `${c.shop_name}：解約の後始末が残っています`, left.map(x => x[1]).join("／"), c.id);
      continue;
    }
    const k = contract(c), m = money(c);
    if (m.unpaid.length >= 2) add(3, "alert", `${c.shop_name}：未入金 ${m.unpaid.length}か月分（${yen(m.owed)}）`, "契約を解除できる状態です（8条1項）。まず連絡を", c.id);
    else if (m.unpaid.length === 1) add(3, "card", `${c.shop_name}：${ymLabel(m.unpaid[0].ym)}分が未入金`, "カードの確認をお願いする（LINE文はカルテに）。1か月分以上で公開停止できます（8条2項）", c.id);
    if (m.pending.length) add(2, "search", `${c.shop_name}：${ymLabel(m.pending[0].ym)}分の入金を確認`, "Squareで決済できたか見て「入金済み」に", c.id);
    if (c.status === "stopped" && !m.unpaid.length) add(2, "up", `${c.shop_name}：入金済みなのに公開停止のまま`, "ホームページを戻して状態を「公開中」に", c.id);
    if (c.status === "prep") {
      if (!c.card_ok && k.started && diffD(k.p, T) <= 7) add(3, "card", `${c.shop_name}：カード未登録のまま公開日が近い`, `公開日 ${jd(c.publish_date)}。初回は公開日に決済（6条）`, c.id);
      if (!c.signed) add(2, "sign", `${c.shop_name}：契約書の署名がまだ`, "署名をもらってから公開する", c.id);
      if (!c.publish_date) add(1, "cal", `${c.shop_name}：公開日が未定`, "公開日を入れると満了日・決済日が自動で出ます", c.id);
      if (k.started && T >= k.p) add(2, "up", `${c.shop_name}：公開日を過ぎています`, "公開したら状態を「公開中」に", c.id);
    }
    if (c.waiting_material && c.material_since && diffD(T, D(c.material_since)) >= 7) add(2, "box", `${c.shop_name}：素材待ちが${diffD(T, D(c.material_since))}日`, c.material_note || "写真・ロゴなどの催促を", c.id);
    if (k.started && !k.after && c.status !== "canceling") {
      const d = diffD(k.noticeBy, T);
      if (d >= 0 && d <= 30) add(2, "hour", `${c.shop_name}：満了の申出締切まで${d}日`, `満了 ${jd(iso(k.end))}。何もなければ自動で継続（4条2項）。継続の確認を`, c.id);
    }
    if (c.status === "canceling" && c.cancel_date) {
      const d = diffD(D(c.cancel_date), T);
      if (d <= 14) add(2, "door", `${c.shop_name}：解約日まで${Math.max(0, d)}日`, "解約金の入金と後始末の準備", c.id);
      const plan = cancelPlan(c, c.cancel_notice);
      if (plan.fee > 0 && !DB.payments.some(p => p.customer_id === c.id && p.kind === "cancel_fee" && p.status === "paid")) add(2, "yen", `${c.shop_name}：解約金 ${yen(plan.fee)} が未入金`, "請求から30日以内に一括（7条2項）", c.id);
    }
    if (c.domain_renew) { const d = diffD(D(c.domain_renew), T); if (d <= 30) add(d < 0 ? 3 : 2, "globe", `${c.shop_name}：ドメイン更新${d < 0 ? "日を過ぎています" : "まで" + d + "日"}`, c.domain || "", c.id); }
    const n = fixCount(c.id, ymOf(T)); if (n > FREE_FIX) add(1, "cut", `${c.shop_name}：今月の修正が${n}回（無料は2回）`, "3回目以降は追加料金の相談（5条2項）", c.id);
    if (c.status === "live" && k.started) {
      const age = diffD(T, k.p), lc = lastContact(c.id);
      if (age >= 30 && age <= 45 && (!lc || lc < addD(k.p, 25))) add(1, "smile", `${c.shop_name}：公開から1か月。ご様子うかがい`, "「お客さんから何か言われましたか？」直したい所を聞く＋口コミのお願い", c.id);
      else if (age > 45 && (!lc || diffD(T, lc) >= 90)) add(1, "smile", `${c.shop_name}：${lc ? diffD(T, lc) + "日" : "しばらく"}連絡していません`, "季節のお知らせ・営業時間の変更がないか一声かける（解約の芽を早めに摘む）", c.id);
    }
  }
  for (const r of DB.requests.filter(reqOpen)) {
    const c = cust(r.customer_id), nm = c ? c.shop_name : (r.line_name || "未登録のお客さん");
    if (!r.customer_id) { add(2, "link", `${nm}：どのお客さんか未登録のLINE依頼`, "「修正」タブで押して、お客さんを選ぶ", "req"); continue; }

    if (r.status === "await_ok") add(3, "eye", `${nm}：見本の確認待ち`, "LINEで「OK・公開して返信」か「直す」", c.id);
    if (r.status === "error") add(3, "alert", `${nm}：LINE係が止まりました`, "PCのClaude Codeに「VISIONのLINEを見て」", c.id);

  return out.sort((a, b) => b.lv - a.lv);
}

function monthTotals(ym) {
  const ps = DB.payments.filter(p => p.month === ym && p.status === "paid");
  const sum = k => ps.filter(p => p.kind === k).reduce((s, p) => s + p.amount, 0);
  const total = ps.reduce((s, p) => s + p.amount, 0);
  const sq = ps.filter(p => (p.method || "square") === "square").reduce((s, p) => s + p.amount, 0);
  return { total, monthly: sum("monthly"), extra: sum("extra"), cancel: sum("cancel_fee") + sum("transfer_fee") + sum("other"), fee: Math.round(sq * FEE_RATE), net: total - Math.round(sq * FEE_RATE) };
}

function workMinutes(ym) { return DB.requests.filter(r => ymOf(new Date(r.received_at)) === ym).reduce((s, r) => s + (r.minutes || 0), 0); }

function sheet(title, html, onSave, opts = {}) {
  const bg = document.createElement("div"); bg.className = "sheet-bg";
  bg.innerHTML = `<div class="sheet"><h3>${title}</h3><form>${html}<div class="btns" style="margin-top:8px"><button class="btn" type="submit" style="flex:1">${opts.ok || "保存"}</button><button class="btn ghost" type="button" data-x>やめる</button>${opts.del ? '<button class="btn red" type="button" data-del>消す</button>' : ""}</div></form></div>`;
  document.body.appendChild(bg);
  const close = () => bg.remove();
  bg.addEventListener("click", e => { if (e.target === bg || e.target.closest("[data-x]")) close(); });
  bg.querySelectorAll(".seg").forEach(s => s.addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; e.preventDefault(); s.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); s.dataset.v = b.dataset.v; s.dispatchEvent(new Event("change", { bubbles: true })); }));
  if (opts.del) bg.querySelector("[data-del]").onclick = async () => { if (!confirm(opts.delMsg || "消してもいいですか？（元に戻せません）")) return; try { await opts.del(); close(); render(); } catch (e) { toast("消せませんでした " + e.message); } };
  const form = bg.querySelector("form");
  if (opts.onChange) { form.addEventListener("input", () => opts.onChange(form)); form.addEventListener("change", () => opts.onChange(form)); opts.onChange(form); }
  if (opts.after) opts.after(form);
  form.onsubmit = async e => {
    e.preventDefault();
    const v = {}; form.querySelectorAll("[name]").forEach(i => v[i.name] = i.type === "checkbox" ? i.checked : i.value.trim());
    form.querySelectorAll(".seg[data-name]").forEach(s => v[s.dataset.name] = s.dataset.v);
    const btn = form.querySelector("[type=submit]"); btn.disabled = true;
    try { const r = await onSave(v, form); if (r === false) { btn.disabled = false; return; } close(); render(); } catch (err) { btn.disabled = false; toast("保存できませんでした " + err.message); }
  };
}

  ev("d3", "call", "決済失敗の件で電話。カードを作り直し中、今週中に再登録すると", -3);
  ev("d1", "trouble", "Googleマップの営業時間がHPと違うと言われた", -1, false);
  ev("d1", "visit", "公開1か月のご様子うかがい。予約が月5件増えたと", -380);
  ev("d1", "system", "お客さんとして登録（契約）", -450);
  DB2.receipts.push({ id: "rc1", no: 1, customer_id: "d1", issued_on: d(-20), to_name: "hair room ミルラ", note: `${ymLabel(ym(-1))}分 ホームページ運用サービス月額料金\t5000`, amount: 5000, tax: 454 });
  return DB2;
}

/* ───── 起動 ───── */
function gate(msg = "") {
  $("#app").innerHTML = `<div class="gate"><img src="icon-192.png" alt=""><div style="font-family:Marcellus;letter-spacing:.32em;color:var(--gold2)">VISION</div><div style="font-size:20px;font-weight:700">お客さんカルテ</div>
    <div style="font-size:13px;color:var(--onsub)">${msg || "最初の1回だけ、営業地図と同じ合言葉を入れてください<br>（次からは自動で開きます）"}</div>
    <input id="k" type="password" autocomplete="current-password" placeholder="合言葉"><button class="btn" id="go">ひらく</button>
    <a href="?demo=1" style="color:var(--gold2);font-size:13px">見本データで見る</a></div>`;
  $("#go").onclick = () => { key = $("#k").value.trim(); store.set("vmap_key", key); boot(); };
}
async function autoKey() {             // 勇次郎を開いたことのある端末なら、勇次郎から合言葉をもらう（営業地図と同じ仕組み）
  const hk = String(store.get("hayato_key")).normalize("NFKC").replace(/\s+/g, ""); if (!hk) return false;
  const fresh = async () => { const t = await (await fetch("https://ntfy.sh/hayato-url-3218359548/json?poll=1&since=24h")).text();
    const us = t.trim().split("\n").map(l => { try { return JSON.parse(l).message; } catch (e) { return ""; } }).filter(x => /^https:\/\/[a-z0-9-]+\.trycloudflare\.com$/.test(x || "")); return us[us.length - 1] || ""; };
  for (const cached of [store.get("hayato_url_cache"), ""]) {
    try { const url = cached || await fresh(); if (!url) continue;
      const j = await (await fetch(url + "/api/vmap-key", { headers: { "X-Key": hk } })).json();
      if (j.key) { key = j.key; store.set("vmap_key", key); return true; } } catch (e) {}
  }
  return false;
}
async function boot() {
  if (!DEMO && !key && !(await autoKey())) return gate();
  $("#app").innerHTML = `<div class="gate"><img src="icon-192.png" alt=""><div style="color:var(--onsub)">読み込み中…</div></div>`;
  try { await loadAll(); render(); }
  catch (e) { gate("読み込めませんでした（合言葉が違う？）"); }
}
if ("serviceWorker" in navigator && !DEMO) navigator.serviceWorker.register("sw.js").catch(() => {});
boot();
</script>
