<style>
:root{
  --deep:#053820;--deep2:#0b4a2c;--night:#06281a;--gold:#c9a24a;--gold2:#e9d9a8;--cream:#f8f3e6;
  --bg:#f2f4f1;--card:#fff;--ink:#17231c;--sub:#5f6f66;--line:#dde3de;
  --red:#b3261e;--redbg:#fbeceb;--amber:#a76a00;--amberbg:#fdf3dc;--ok:#1d7a4a;--okbg:#e6f3ec;--blue:#245c9c;--bluebg:#e8f0fa;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New",system-ui,sans-serif;font-size:15px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-feature-settings:"tnum";letter-spacing:.01em}
.en{font-family:Marcellus,serif;letter-spacing:.12em}
/* ヘッダー */
header{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,var(--night),var(--deep) 60%,var(--deep2));color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 16px 12px;border-bottom:2px solid var(--gold)}
.hd{display:flex;align-items:center;gap:12px;max-width:760px;margin:0 auto}
.hd img{width:40px;height:40px;border-radius:10px;box-shadow:0 0 0 1px rgba(201,162,74,.6)}
.hd .t1{font-size:11px;color:var(--gold2)}
.hd .t2{font-size:17px;font-weight:700;letter-spacing:.04em}
.hd .sp{flex:1}
.hd .demo{font-size:11px;background:var(--gold);color:var(--night);border-radius:20px;padding:2px 10px;font-weight:700}
main{max-width:760px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom))}
/* 下のタブ */
nav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--night);border-top:1px solid rgba(201,162,74,.5);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav .in{display:flex;width:100%;max-width:760px}
nav button{flex:1;background:none;border:0;color:#9fb3a8;padding:9px 0 8px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--gold)}
nav .badge{position:absolute;top:4px;left:calc(50% + 6px);background:var(--red);color:#fff;border-radius:10px;font-size:10px;min-width:17px;padding:0 4px;line-height:17px}
/* 共通部品 */
h2{font-size:13px;color:var(--sub);font-weight:700;margin:22px 2px 8px;letter-spacing:.06em;display:flex;align-items:center;gap:8px}
h2::before{content:"";width:4px;height:14px;background:var(--gold);border-radius:2px}
.card{background:var(--card);border:2px solid #cfd8d2;border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:0 2px 6px rgba(5,56,32,.06)}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.muted{color:var(--sub);font-size:13px}
.small{font-size:12px}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:20px;padding:2px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.c-prep{background:var(--bluebg);color:var(--blue)}.c-live{background:var(--okbg);color:var(--ok)}.c-stopped{background:var(--redbg);color:var(--red)}
.c-canceling{background:var(--amberbg);color:var(--amber)}.c-closed{background:#eceeed;color:#6b746f}.c-warn{background:var(--redbg);color:var(--red)}
.btn{white-space:nowrap;border:0;border-radius:12px;padding:12px 16px;font-weight:700;background:var(--deep);color:#fff;cursor:pointer}
.btn.gold{background:var(--gold);color:var(--night)}
.btn.ghost{background:#fff;color:var(--deep);border:2px solid var(--deep)}
.btn.red{background:var(--red)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}

.btns{display:flex;gap:8px;flex-wrap:wrap}
.fab{position:fixed;right:max(16px,calc(50% - 364px));bottom:calc(76px + env(safe-area-inset-bottom));z-index:15;background:var(--gold);color:var(--night);border:0;border-radius:30px;padding:14px 20px;font-weight:900;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.empty{text-align:center;color:var(--sub);padding:28px 10px}

/* ホームの数字 */
.hero{background:linear-gradient(140deg,var(--night),var(--deep));color:#fff;border-radius:18px;padding:18px;position:relative;overflow:hidden;border:1px solid rgba(201,162,74,.5)}

.bar{height:10px;background:rgba(255,255,255,.15);border-radius:6px;overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#f0d58a);border-radius:6px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.kpi{background:#fff;border:2px solid #cfd8d2;border-radius:12px;padding:10px;text-align:center}
.kpi b{display:block;font-size:20px;color:var(--deep)}
.kpi span{font-size:11px;color:var(--sub)}

/* やること */
.todo{display:flex;gap:12px;align-items:flex-start;background:#fff;border:2px solid #cfd8d2;border-left:6px solid var(--amber);border-radius:12px;padding:12px;margin-bottom:8px;cursor:pointer}
.todo.hi{border-left-color:var(--red)}

/* 一覧 */
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.filters button{flex:none;border:2px solid #cfd8d2;background:#fff;border-radius:20px;padding:6px 12px;font-size:13px;font-weight:700;color:var(--sub)}

.search{width:100%;border:2px solid #cfd8d2;border-radius:12px;padding:10px 12px;margin:10px 0;background:#fff}
.cust{cursor:pointer}
.cust .nm{font-size:16px;font-weight:700}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.meta span{font-size:12px;background:var(--bg);border-radius:8px;padding:2px 8px;color:var(--sub)}
.meta span.bad{background:var(--redbg);color:var(--red);font-weight:700}

/* カルテ */
.kh{background:linear-gradient(140deg,var(--night),var(--deep));color:#fff;border-radius:18px;padding:16px;border:1px solid rgba(201,162,74,.5)}
.kh .nm{font-size:21px;font-weight:900}
.kh .sub{font-size:12px;color:var(--gold2)}
.kh .acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.kh .acts a,.kh .acts button{background:rgba(255,255,255,.1);border:1px solid rgba(201,162,74,.6);color:#fff;border-radius:10px;padding:7px 12px;font-size:13px;text-decoration:none;font-weight:700}
.back{background:none;border:0;color:var(--deep);font-weight:700;padding:4px 0 10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--sub)}.kv dd{margin:0;font-weight:500}
.alert{border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:8px;font-weight:500}
.alert.red{background:var(--redbg);color:var(--red)}.alert.amber{background:var(--amberbg);color:var(--amber)}.alert.blue{background:var(--bluebg);color:var(--blue)}.alert.ok{background:var(--okbg);color:var(--ok)}
.months{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.mo{border-radius:10px;padding:6px 2px;text-align:center;font-size:11px;border:2px solid transparent;cursor:pointer;background:var(--bg);color:var(--sub)}
.mo b{display:block;font-size:13px}
.mo.paid{background:var(--okbg);color:var(--ok)}.mo.failed{background:var(--redbg);color:var(--red)}.mo.pending{background:var(--amberbg);color:var(--amber)}.mo.waived{background:#eceeed;color:#6b746f}.mo.future{opacity:.45}
.mo.now{border-color:var(--gold)}
.counter{display:flex;align-items:baseline;gap:4px}
.counter b{font-size:34px;color:var(--deep);font-weight:900}
.counter.over b{color:var(--red)}
.dots{display:flex;gap:6px;margin-left:10px}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--gold)}
.req{border-top:1px solid var(--line);padding:10px 0}
.req:first-child{border-top:0}
.tl{border-left:2px solid var(--gold2);margin-left:6px;padding-left:14px}
.tl .ev{position:relative;padding:4px 0 12px}
.tl .ev::before{content:"";position:absolute;left:-21px;top:9px;width:10px;height:10px;border-radius:50%;background:var(--gold)}
.tl .ev.trouble::before{background:var(--red)}
.check{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.check input{width:20px;height:20px;accent-color:var(--deep)}
/* お金 */
.chart{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:16px}
.chart .c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.chart .c i{display:block;width:100%;max-width:34px;background:var(--deep);border-radius:6px 6px 2px 2px;min-height:2px}
.chart .c.cur i{background:var(--gold)}
.chart .c span{font-size:10px;color:var(--sub)}
.chart .c em{white-space:nowrap;font-style:normal;font-size:10px;color:var(--deep);font-weight:700}
.mnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.mnav button{background:#fff;border:2px solid #cfd8d2;border-radius:10px;width:40px;height:36px;font-weight:900}
.mnav b{font-size:17px}
table.list{width:100%;border-collapse:collapse;font-size:14px}
table.list td{padding:9px 4px;border-top:1px solid var(--line);vertical-align:middle}
table.list td.r{text-align:right}
table.list tr:first-child td{border-top:0}
/* シート（入力画面） */
.sheet-bg{position:fixed;inset:0;background:rgba(6,40,26,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));border-top:3px solid var(--gold)}
.sheet h3{margin:0 0 12px;font-size:18px}
.f{margin-bottom:12px}
.f label{display:block;font-size:12px;color:var(--sub);font-weight:700;margin-bottom:4px}
.f input,.f select,.f textarea{width:100%;border:2px solid #cfd8d2;border-radius:10px;padding:10px;background:#fff}
.f textarea{min-height:80px}
.f.ck label{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink);font-weight:500}
.f.ck input{width:20px;height:20px;accent-color:var(--deep)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:2px solid #cfd8d2;background:#fff;border-radius:10px;padding:8px 12px;font-weight:700;font-size:13px}
.seg button.on{background:var(--deep);border-color:var(--deep);color:#fff}
.calc{background:var(--cream);border:1px solid var(--gold2);border-radius:12px;padding:12px;font-size:14px;margin-bottom:12px}
.calc b{color:var(--deep)}
/* 合言葉 */
.gate{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:linear-gradient(160deg,var(--night),var(--deep));color:#fff;padding:24px;text-align:center}
.gate img{width:110px;border-radius:24px;box-shadow:0 0 0 1px var(--gold)}
.gate input{width:min(320px,90vw);border:1px solid var(--gold);background:rgba(255,255,255,.08);color:#fff;border-radius:12px;padding:12px;text-align:center}
</style>

<body>
<div id="app"></div>
<script>
"use strict";
const SB = "https://aevqdsozxiklyjfavvhf.supabase.co/rest/v1/", PK = "sb_publishable_3J-KuCCmuO_d7WLzQrsrTg_U3QiaF_I";
const PRICE = 5000, GOAL = 500000, FEE_RATE = 0.0375, MIN_YEARS = 5, FREE_FIX = 2;
const DEMO = /[?&]demo=1/.test(location.search);
const ST = { prep: "準備中", live: "公開中", stopped: "公開停止", canceling: "解約予定", closed: "解約済み" };
const PAYK = { monthly: "月額", extra: "追加作業", cancel_fee: "解約金", transfer_fee: "ドメイン移管", other: "その他" };
const PAYS = { paid: "入金済み", failed: "失敗", waived: "免除" };
const METH = { square: "Square（カード）", cash: "現金", transfer: "振込", other: "その他" };
const SRC = { line: "LINE", phone: "電話", visit: "訪問", mail: "メール", other: "その他" };
const RKIND = { small: "軽い修正（月2回に数える）", large: "大きな修正（見積もり）", extra: "追加作業（有料）" };
const RST = { new: "受付", await_assign: "担当待ち", assigned: "作業中", await_ok: "見本の確認待ち", approved: "公開中…", done: "完了",
  closed_self: "自分で対応", closed_reject: "断った", closed_stop: "やめた", merged: "まとめた", error: "止まった" };
const EVT = { call: "📞 電話", visit: "🚶 訪問", line: "💬 LINE", mail: "✉️ メール", memo: "📝 メモ", trouble: "⚠️ トラブル", system: "⚙️ 記録" };
const CLOSEOUT = [["square", "Squareの定期請求を止めた"], ["site", "ホームページを閉じた（または移管した）"], ["line", "LINEの紐付けを外した"], ["domain", "ドメインの扱いを決めた（移管／解約）"], ["money", "解約金・未払いの入金を確認した"]];

/* ───── 小道具 ───── */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const yen = n => (n < 0 ? "-" : "") + "¥" + Math.abs(Math.round(n)).toLocaleString();
const man = n => (n / 10000).toLocaleString(undefined, { maximumFractionDigits: 1 }) + "万円";
const store = { get(k) { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
const pad = n => String(n).padStart(2, "0");
const D = s => { if (!s) return null; const [y, m, d] = String(s).slice(0, 10).split("-").map(Number); return new Date(y, m - 1, d); };
const iso = d => d ? `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}` : "";
const ymOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
const today = () => { const t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); };
const addM = (d, n) => { const r = new Date(d.getFullYear(), d.getMonth() + n, 1); const last = new Date(r.getFullYear(), r.getMonth() + 1, 0).getDate(); r.setDate(Math.min(d.getDate(), last)); return r; };
const addD = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const diffD = (a, b) => Math.round((a - b) / 86400000);
const ymAdd = (ym, n) => { const [y, m] = ym.split("-").map(Number); return ymOf(new Date(y, m - 1 + n, 1)); };
const ymLabel = ym => { const [y, m] = ym.split("-").map(Number); return `${y}年${m}月`; };
const jd = s => { const d = D(s); return d ? `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}` : "—"; };
const jdt = s => { if (!s) return "—"; const d = new Date(s); return `${d.getMonth() + 1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const bizAdd = (d, n) => { let r = new Date(d); while (n > 0) { r = addD(r, 1); if (r.getDay() !== 0 && r.getDay() !== 6) n--; } return r; };
const monthsBetween = (a, b) => { const [y1, m1] = a.split("-").map(Number), [y2, m2] = b.split("-").map(Number); return (y2 - y1) * 12 + (m2 - m1); };
function toast(t) { const e = document.createElement("div"); e.className = "toast"; e.textContent = t; document.body.appendChild(e); setTimeout(() => e.remove(), 2600); }
async function copy(t) { try { await navigator.clipboard.writeText(t); toast("コピーしました。LINEに貼り付けてください"); } catch (e) { prompt("コピーしてください", t); } }

/* ───── データ ───── */
let key = store.get("vmap_key");
(() => { const m = location.hash.match(/vk=([A-Za-z0-9]+)/); if (m) { key = m[1]; store.set("vmap_key", key); history.replaceState(null, "", location.pathname + location.search); } })();
let DB = { customers: [], payments: [], requests: [], events: [] };
const TBL = { customers: "vcrm_customers", payments: "vcrm_payments", requests: "vcrm_requests", events: "vcrm_events" };
async function api(path, opt = {}) {
  const r = await fetch(SB + path, { ...opt, headers: { apikey: PK, "x-vmap-key": key, "Content-Type": "application/json", Prefer: "return=representation", ...(opt.headers || {}) } });
  if (!r.ok) throw new Error(r.status + " " + (await r.text()).slice(0, 160));
  const t = await r.text(); return t ? JSON.parse(t) : null;
}
async function loadAll() {
  if (DEMO) { DB = demoData(); return; }
  // 合言葉が違うと「0件」で返ってくるので、営業地図の印が読めるかで確かめる
  const chk = await api("vmap_places?select=id&limit=1");
  if (!chk || !chk.length) throw new Error("合言葉");
  const [c, p, q, e] = await Promise.all([
    api("vcrm_customers?select=*&order=created_at.asc"), api("vcrm_payments?select=*&order=month.asc"),
    api("vcrm_requests?select=*&order=received_at.desc&limit=1000"), api("vcrm_events?select=*&order=at.desc&limit=2000")]);
  DB = { customers: c, payments: p, requests: q, events: e };
}
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now() + "-" + Math.random().toString(36).slice(2));
async function save(kind, row) {           // row.id があれば更新、なければ追加
  const list = DB[kind];
  if (kind === "customers" || kind === "requests") row.updated_at = new Date().toISOString();
  if (row.id && list.some(x => x.id === row.id)) {
    const { id, ...rest } = row;
    if (!DEMO) { const [r] = await api(`${TBL[kind]}?id=eq.${encodeURIComponent(id)}`, { method: "PATCH", body: JSON.stringify(rest) }); Object.assign(row, r); }
    const i = list.findIndex(x => x.id === id); list[i] = { ...list[i], ...row };
    return list[i];
  }
  row.id = row.id || uid();
  if (!DEMO) { const [r] = await api(TBL[kind], { method: "POST", body: JSON.stringify(row) }); Object.assign(row, r); }
  list.push(row); return row;
}
async function del(kind, id) {
  if (!DEMO) await api(`${TBL[kind]}?id=eq.${encodeURIComponent(id)}`, { method: "DELETE" });
  DB[kind] = DB[kind].filter(x => x.id !== id);
}
const cust = id => DB.customers.find(c => c.id === id);
function log(cid, type, text, resolved = true) { return save("events", { customer_id: cid, type, text, at: new Date().toISOString(), resolved }); }

/* ───── 契約の計算（契約書の条文どおり） ───── */
function contract(c) {
  const T = today(), p = D(c.publish_date);
  if (!p) return { started: false };
  const end = addD(addM(p, MIN_YEARS * 12), -1);                    // 公開日から5年（4条1項）
  const noticeBy = addM(end, -3);                                   // 満了3か月前までに申出がなければ継続（4条2項）
  const after = T > end;                                            // 満了後＝期間の定めなし
  const leftM = Math.max(0, monthsBetween(ymOf(T), ymOf(end)));
  return { started: true, p, end, noticeBy, after, leftM, endYM: ymOf(end) };
}
function cancelPlan(c, noticeStr) {                                 // 解約の申出日 → 解約日・解約金（7条）
  const k = contract(c), n = D(noticeStr) || today();
  const cdate = addM(n, 1);                                         // 1か月前までに通知
  if (!k.started) return { cdate, fee: 0, months: 0, note: "公開前のため解約金の計算対象外（扱いは要相談）" };
  if (cdate > k.end) return { cdate, fee: 0, months: 0, note: "満了後のため解約金なし（4条3項）" };
  const months = Math.max(0, monthsBetween(ymOf(cdate), k.endYM));  // 解約月の翌月〜満了月
  return { cdate, fee: months * (c.monthly || PRICE), months, due: addD(today(), 30), note: `解約月の翌月〜満了月（${ymLabel(k.endYM)}）の${months}か月分（7条2項）` };
}
function dueMonths(c) {                                             // 月額が発生した（決済日を過ぎた）月の一覧
  const k = contract(c); if (!k.started) return [];
  const T = today(), out = [], startYM = ymOf(k.p);
  let lastYM = ymOf(T);
  if (c.cancel_date) { const cd = D(c.cancel_date); if (ymOf(cd) < lastYM) lastYM = ymOf(cd); }
  for (let ym = startYM; ym <= lastYM; ym = ymAdd(ym, 1)) {
    const [y, m] = ym.split("-").map(Number);
    const due = ym === startYM ? k.p : new Date(y, m - 1, Math.min(c.pay_day || 27, new Date(y, m, 0).getDate()));
    out.push({ ym, due, passed: due <= T });
  }
  return out;
}
function payOf(cid, ym) { return DB.payments.find(p => p.customer_id === cid && p.month === ym && p.kind === "monthly"); }
function money(c) {                                                 // 未払いの状態
  const T = today(), rows = dueMonths(c).filter(r => r.passed);
  const unpaid = [], pending = [];
  for (const r of rows) {
    const p = payOf(c.id, r.ym);
    if (p && (p.status === "paid" || p.status === "waived")) continue;
    if (p && p.status === "failed") unpaid.push(r);
    else if (diffD(T, r.due) >= 3) unpaid.push(r); else pending.push(r);  // 決済日から3日たっても確認なし＝未入金扱い
  }
  const late = unpaid.reduce((s, r) => s + (c.monthly || PRICE) * 0.146 * Math.max(0, diffD(T, r.due) - 1) / 365, 0);
  return { unpaid, pending, owed: unpaid.length * (c.monthly || PRICE), late };
}
function fixCount(cid, ym) {
  return DB.requests.filter(r => r.customer_id === cid && r.counted !== false && (r.kind || "small") === "small" && !["merged", "closed_reject", "closed_stop"].includes(r.status) && ymOf(new Date(r.received_at)) === ym).length;
}
function reqDue(r) { return bizAdd(new Date(r.received_at), 5); }   // 5営業日（5条3項・祝日は数えていない）
const reqOpen = r => !["done", "closed_self", "closed_reject", "closed_stop", "merged"].includes(r.status);

/* ───── 今日やること（自動） ───── */
function todos() {
  const T = today(), out = [];
  const add = (lv, ic, title, sub, go) => out.push({ lv, ic, title, sub, go });
  for (const c of DB.customers) {
    if (c.status === "closed") {
      const left = CLOSEOUT.filter(([k]) => !(c.closeout || {})[k]);
      if (left.length) add(1, "🧹", `${c.shop_name}：解約の後始末が残っています`, left.map(x => x[1]).join("／"), c.id);
      continue;
    }
    const k = contract(c), m = money(c);
    if (m.unpaid.length >= 2) add(3, "⛔", `${c.shop_name}：未入金 ${m.unpaid.length}か月分（${yen(m.owed)}）`, "契約を解除できる状態です（8条1項）。まず連絡を", c.id);
    else if (m.unpaid.length === 1) add(3, "💳", `${c.shop_name}：${ymLabel(m.unpaid[0].ym)}分が未入金`, "カードの確認をお願いする（LINE文はカルテにあります）。1か月分以上で公開停止できます（8条2項）", c.id);
    if (m.pending.length) add(2, "🔎", `${c.shop_name}：${ymLabel(m.pending[0].ym)}分の入金を確認`, "Squareで決済できたか見て「入金済み」に", c.id);
    if (c.status === "prep") {
      if (!c.card_ok && k.started && diffD(k.p, T) <= 7) add(3, "💳", `${c.shop_name}：カード未登録のまま公開日が近い`, `公開日 ${jd(c.publish_date)}。初回は公開日に決済（6条）`, c.id);
      if (!c.signed) add(2, "✍️", `${c.shop_name}：契約書の署名がまだ`, "署名をもらってから公開する", c.id);
      if (!c.publish_date) add(1, "📅", `${c.shop_name}：公開日が未定`, "公開日を入れると満了日・決済日が自動で出ます", c.id);
      if (k.started && T >= k.p) add(2, "🚀", `${c.shop_name}：公開日を過ぎています`, "公開したら状態を「公開中」に", c.id);
    }
    if (c.waiting_material && c.material_since && diffD(T, D(c.material_since)) >= 7) add(2, "📦", `${c.shop_name}：素材待ちが${diffD(T, D(c.material_since))}日`, c.material_note || "写真・ロゴなどの催促を", c.id);
    if (k.started && !k.after && c.status !== "canceling") {
      const d = diffD(k.noticeBy, T);
      if (d >= 0 && d <= 30) add(2, "⏳", `${c.shop_name}：満了の申出締切まで${d}日`, `満了 ${jd(iso(k.end))}。何もなければ自動で継続（4条2項）。継続の確認を`, c.id);
    }
    if (c.status === "canceling" && c.cancel_date) {
      const d = diffD(D(c.cancel_date), T);
      if (d <= 14) add(2, "🚪", `${c.shop_name}：解約日まで${Math.max(0, d)}日`, "解約金の入金と後始末の準備", c.id);
      const plan = cancelPlan(c, c.cancel_notice);
      if (plan.fee > 0 && !DB.payments.some(p => p.customer_id === c.id && p.kind === "cancel_fee" && p.status === "paid")) add(2, "💴", `${c.shop_name}：解約金 ${yen(plan.fee)} が未入金`, "請求から30日以内に一括（7条2項）", c.id);
    }
    if (c.domain_renew) { const d = diffD(D(c.domain_renew), T); if (d <= 30) add(d < 0 ? 3 : 2, "🌐", `${c.shop_name}：ドメイン更新${d < 0 ? "日を過ぎています" : "まで" + d + "日"}`, c.domain || "", c.id); }
    if (fixCount(c.id, ymOf(T)) > FREE_FIX) add(1, "✂️", `${c.shop_name}：今月の修正が${fixCount(c.id, ymOf(T))}回（無料は2回）`, "3回目以降は追加料金の相談（5条2項）", c.id);
  }
  for (const r of DB.requests.filter(reqOpen)) {
    const c = cust(r.customer_id), nm = c ? c.shop_name : (r.line_name || "未登録のお客さん");
    if (!r.customer_id) { add(2, "🔗", `${nm}：どのお客さんか未登録のLINE依頼`, "「修正」タブで紐付け", "req"); continue; }
    if (r.status === "await_assign") add(3, "💬", `${nm}：LINE依頼の担当を決める`, "スマホのLINEに確認が届いています", c ? c.id : "req");
    if (r.status === "await_ok") add(3, "👀", `${nm}：見本の確認待ち`, "LINEで「OK・公開して返信」か「直す」", c ? c.id : "req");
    const d = diffD(reqDue(r), T);
    if (d <= 1) add(d < 0 ? 3 : 2, "⏰", `${nm}：修正の期限${d < 0 ? "を" + (-d) + "日過ぎています" : d === 0 ? "は今日" : "は明日"}`, (r.summary || r.body || "").slice(0, 60), c ? c.id : "req");
  }
  for (const e of DB.events.filter(e => e.type === "trouble" && e.resolved === false)) { const c = cust(e.customer_id); add(3, "⚠️", `${c ? c.shop_name : ""}：未解決のトラブル`, (e.text || "").slice(0, 60), e.customer_id); }
  return out.sort((a, b) => b.lv - a.lv);
}

/* ───── 売上 ───── */
function monthTotals(ym) {
  const ps = DB.payments.filter(p => p.month === ym && p.status === "paid");
  const sum = k => ps.filter(p => p.kind === k).reduce((s, p) => s + p.amount, 0);
  const total = ps.reduce((s, p) => s + p.amount, 0);
  const sq = ps.filter(p => (p.method || "square") === "square").reduce((s, p) => s + p.amount, 0);
  return { total, monthly: sum("monthly"), extra: sum("extra"), cancel: sum("cancel_fee") + sum("transfer_fee") + sum("other"), fee: Math.round(sq * FEE_RATE), net: total - Math.round(sq * FEE_RATE) };
}

function sheet(title, html, onSave, opts = {}) {
  const bg = document.createElement("div"); bg.className = "sheet-bg";
  bg.innerHTML = `<div class="sheet"><h3>${title}</h3><form>${html}<div class="btns" style="margin-top:6px"><button class="btn" type="submit" style="flex:1">${opts.ok || "保存"}</button><button class="btn ghost" type="button" data-x>やめる</button>${opts.del ? '<button class="btn red" type="button" data-del>消す</button>' : ""}</div></form></div>`;
  document.body.appendChild(bg);
  const close = () => bg.remove();
  bg.addEventListener("click", e => { if (e.target === bg || e.target.closest("[data-x]")) close(); });
  bg.querySelectorAll(".seg").forEach(s => s.addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; e.preventDefault(); s.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); s.dataset.v = b.dataset.v; s.dispatchEvent(new Event("change", { bubbles: true })); }));
  if (opts.del) bg.querySelector("[data-del]").onclick = async () => { if (!confirm("消してもいいですか？（元に戻せません）")) return; try { await opts.del(); close(); render(); } catch (e) { toast("消せませんでした " + e.message); } };
  const form = bg.querySelector("form");
  if (opts.onChange) { form.addEventListener("input", () => opts.onChange(form)); form.addEventListener("change", () => opts.onChange(form)); opts.onChange(form); }
  form.onsubmit = async e => {
    e.preventDefault();
    const v = {}; form.querySelectorAll("[name]").forEach(i => v[i.name] = i.type === "checkbox" ? i.checked : i.value.trim());
    form.querySelectorAll(".seg[data-name]").forEach(s => v[s.dataset.name] = s.dataset.v);
    const btn = form.querySelector("[type=submit]"); btn.disabled = true;
    try { const r = await onSave(v); if (r === false) { btn.disabled = false; return; } close(); render(); } catch (err) { btn.disabled = false; toast("保存できませんでした " + err.message); }
  };
}

    ${fsel("method", "方法", METH, p ? p.method : "square")}${fi("memo", "メモ", p ? p.memo : "", "text", "例：カード期限切れ→再決済")}`,
    async v => {
      await save("payments", { ...(p ? { id: p.id } : {}), customer_id: c.id, month: ym, kind: "monthly", status: v.status, amount: Number(v.amount) || 0, paid_at: nul(v.paid_at), method: v.method, memo: v.memo });
      if (v.status === "failed") await log(c.id, "system", `${ymLabel(ym)}分の決済に失敗${v.memo ? "（" + v.memo + "）" : ""}`);
      toast("つけました");
    }, { del: p ? async () => del("payments", p.id) : null });
}
function addPayment(c, p) {
  sheet(p ? "入金を直す" : "月額以外の入金", `${fsel("kind", "種類", Object.fromEntries(Object.entries(PAYK).filter(([k]) => k !== "monthly")), p ? p.kind : "extra")}
    <div class="grid2">${fi("amount", "金額（税込）", p ? p.amount : "", "number")}${fi("month", "どの月の売上か", p ? p.month : ymOf(today()), "month")}</div>
    ${fseg("status", "状態", { paid: "入金済み", failed: "未入金・失敗" }, p ? p.status : "paid")}
    <div class="grid2">${fi("paid_at", "入金日", p ? p.paid_at : iso(today()), "date")}${fsel("method", "方法", METH, p ? p.method : "square")}</div>
    ${fi("memo", "内容", p ? p.memo : "", "text", "例：メニューページ追加")}`,
    async v => { if (!Number(v.amount)) { toast("金額を入れてください"); return false; }
      await save("payments", { ...(p ? { id: p.id } : {}), customer_id: c.id, kind: v.kind, amount: Number(v.amount), month: v.month, status: v.status, paid_at: nul(v.paid_at), method: v.method, memo: v.memo }); },
    { del: p ? async () => del("payments", p.id) : null });
}
function editRequest(r, cid) {
  const isNew = !r; r = r || { customer_id: cid, source: "phone", kind: "small", counted: true, status: "assigned", received_at: new Date().toISOString() };
  const custOpts = { "": "（未登録のお客さん）", ...Object.fromEntries(DB.customers.filter(c => c.status !== "closed").map(c => [c.id, c.shop_name])) };
  const done = !reqOpen(r);
  sheet(isNew ? "修正依頼を記録" : "修正依頼", `${fsel("customer_id", "お客さん", custOpts, r.customer_id || "")}
    ${!isNew && r.line_name ? `<div class="muted small" style="margin:-6px 0 10px">LINEの名前：${esc(r.line_name)}（紐付けると、次からこの人のLINEは自動でこのお客さんに）</div>` : ""}
    ${fseg("source", "どこから", SRC, r.source || "line")}
    ${fi("received", "受けた日", iso(new Date(r.received_at)), "date")}
    ${fta("body", "内容", r.body || r.summary || "", "例：年末年始のお休みを載せてほしい")}
    ${fsel("kind", "種類", RKIND, r.kind || "small")}
    ${fck("counted", "月2回に数える（同じ依頼が2通に分かれた時などは外す）", r.counted !== false)}
    ${fi("fee", "見積もり・追加料金（円）", r.fee || "", "number")}
    ${fck("done", "終わった", done)}`,
    async v => {
      const row = { ...(isNew ? {} : { id: r.id }), customer_id: nul(v.customer_id), source: v.source, body: v.body, kind: v.kind, counted: v.counted, fee: Number(v.fee) || null };
      const rd = D(v.received); if (rd && iso(rd) !== iso(new Date(r.received_at))) row.received_at = new Date(rd.getFullYear(), rd.getMonth(), rd.getDate(), 9).toISOString();
      if (v.done && !done) { row.status = "done"; row.done_at = new Date().toISOString(); } else if (!v.done && done) row.status = "assigned";
      if (isNew) { row.received_at = row.received_at || r.received_at; row.status = row.status || "assigned"; }
      await save("requests", row);
      if (!isNew && v.customer_id && v.customer_id !== r.customer_id && r.line_user) {   // LINEの紐付け
        await save("customers", { id: v.customer_id, line_user: r.line_user, line_name: r.line_name });
        await log(v.customer_id, "system", `LINE「${r.line_name || ""}」を紐付け`);
      }
      if (isNew && row.customer_id) await log(row.customer_id, "system", `修正依頼（${SRC[v.source]}）：${v.body.slice(0, 40)}`);
    }, { del: isNew ? null : async () => del("requests", r.id) });
}
function addEvent(c, e) {
  sheet(e ? "記録を直す" : "連絡・出来事を記録", `${fseg("type", "種類", { call: "📞 電話", visit: "🚶 訪問", line: "💬 LINE", mail: "✉️ メール", memo: "📝 メモ", trouble: "⚠️ トラブル" }, e ? e.type : "call")}
    ${fta("text", "内容", e ? e.text : "", "例：カード変更の連絡あり。新しいリンクを送った")}
    ${fck("unresolved", "トラブルが未解決（解決するまで「今日やること」に出す）", e ? e.resolved === false : false)}`,
    async v => { if (!v.text) { toast("内容を入れてください"); return false; }
      await save("events", { ...(e ? { id: e.id } : { at: new Date().toISOString() }), customer_id: c.id, type: v.type, text: v.text, resolved: !(v.type === "trouble" && v.unresolved) }); },
    { del: e ? async () => del("events", e.id) : null });
}
async function bulkPaid() {
  const list = DB.customers.map(c => ({ c, r: dueMonths(c).find(x => x.ym === moneyYM) })).filter(x => x.r && x.r.passed && !payOf(x.c.id, moneyYM));
  if (!list.length || !confirm(`${ymLabel(moneyYM)}分：${list.map(x => x.c.shop_name).join("・")} の${list.length}件を「入金済み」にします。Squareで全員の決済成功を確かめましたか？`)) return;
  for (const { c, r } of list) await save("payments", { customer_id: c.id, month: moneyYM, kind: "monthly", status: "paid", amount: c.monthly || PRICE, paid_at: iso(r.due), method: "square" });
  toast(`${list.length}件を入金済みにしました`); render();
}

/* ───── 操作 ───── */
document.addEventListener("click", async e => {
  const t = e.target.closest("[data-tab],[data-open],[data-go],[data-back],[data-act],[data-filter],[data-rfilter],[data-ym],[data-pay],[data-payrow],[data-req],[data-ev],[data-copy]");
  if (!t || t.closest(".sheet-bg")) return;
  const c = openId ? cust(openId) : null, ds = t.dataset;
  if (ds.tab) { tab = ds.tab; openId = null; render(); }
  else if (ds.copy !== undefined) copy(ds.copy);
  else if (ds.open) { window.__ret = window.scrollY; openId = ds.open; render(); }
  else if (ds.go) { if (ds.go === "req") { tab = "req"; openId = null; reqFilter = "open"; } else openId = ds.go; render(); }
  else if (ds.back !== undefined) { openId = null; window.__keep = window.__ret || 0; render(); }
  else if (ds.filter) { filter = ds.filter; render(); }
  else if (ds.rfilter) { reqFilter = ds.rfilter; render(); }
  else if (ds.ym) { moneyYM = ymAdd(moneyYM, Number(ds.ym)); render(); }
  else if (ds.pay && c) payMonth(c, ds.pay);
  else if (ds.payrow && c) addPayment(c, DB.payments.find(p => p.id === ds.payrow));
  else if (ds.req) editRequest(DB.requests.find(r => r.id === ds.req));
  else if (ds.ev && c) addEvent(c, DB.events.find(x => x.id === ds.ev));
  else if (ds.act) ({ newCust: () => editCustomer(), editCust: () => editCustomer(c), status: () => changeStatus(c), cancel: () => cancelFlow(c),
    addPay: () => addPayment(c), addReq: () => editRequest(null, c.id), addEv: () => addEvent(c), bulkPaid })[ds.act]();
});
document.addEventListener("change", async e => {
  const cb = e.target.closest("[data-close]"); if (!cb || !openId) return;
  const c = cust(openId), co = { ...(c.closeout || {}), [cb.dataset.close]: cb.checked };
  try { await save("customers", { id: c.id, closeout: co }); window.__keep = window.scrollY; render(); } catch (err) { toast("保存できませんでした"); }
});
document.addEventListener("input", e => { if (e.target.id === "q") { q = e.target.value; const pos = e.target.selectionStart; render(); const i = $("#q"); i.focus(); i.setSelectionRange(pos, pos); } });

/* ───── 起動 ───── */
function gate(msg = "") {
  $("#app").innerHTML = `<div class="gate"><img src="icon-192.png" alt=""><div class="en" style="color:var(--gold2)">VISION</div><div style="font-size:20px;font-weight:700">お客さんカルテ</div>
    <div style="font-size:13px;color:var(--gold2)">${msg || "営業地図と同じ合言葉を入れてください"}</div>
    <input id="k" type="password" autocomplete="off" placeholder="合言葉"><button class="btn gold" id="go">ひらく</button>
    <a href="?demo=1" style="color:var(--gold2);font-size:13px">見本データで見る</a></div>`;
  $("#go").onclick = () => { key = $("#k").value.trim(); store.set("vmap_key", key); boot(); };
}
async function boot() {
  if (!DEMO && !key) return gate();
  $("#app").innerHTML = `<div class="gate"><img src="icon-192.png" alt=""><div style="color:var(--gold2)">読み込み中…</div></div>`;
  try { await loadAll(); render(); }
  catch (e) { gate("読み込めませんでした（合言葉が違う？）"); }
}
if ("serviceWorker" in navigator && !DEMO) navigator.serviceWorker.register("sw.js").catch(() => {});
boot();
